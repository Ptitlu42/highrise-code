name: showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/capture/package-lock.json

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/highrise-code ./cmd/highrise-code

      - name: Install capture tooling
        working-directory: .github/capture
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Capture showcase
        env:
          HR_BIN: bin/highrise-code
          HR_TARGET: .
          OUT_DIR: showcase_out
        run: node .github/capture/capture.mjs

      - name: Scan statistics
        run: bin/highrise-code -q --stats --format json . > showcase_out/stats.json

      - name: Publish visuals
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          publish_dir="$(mktemp -d)"
          cp showcase_out/*.gif showcase_out/*.png "$publish_dir"/
          cd "$publish_dir"
          git init -q -b showcase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore(showcase): visuals for ${COMMIT:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" showcase

      - name: Refresh README
        env:
          STATS_PATH: showcase_out/stats.json
        run: node .github/capture/update_readme.mjs

      - name: Commit README
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -q -m "docs(readme): refresh live stats"
          git pull --rebase -q origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
